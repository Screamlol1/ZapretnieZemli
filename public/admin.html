<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Запретные Земли · администратор</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="account.css"><link rel="stylesheet" href="admin.css"></head><body><header><span class="sigil">✦</span><div><small>УПРАВЛЕНИЕ СЕРВЕРОМ</small><h1>Администратор</h1></div><a href="/">Личный кабинет</a></header><main class="admin-main"><p id="admin-error" role="alert"></p><p id="admin-status" role="status">Проверяем доступ…</p><div id="admin-content" hidden><div class="toolbar"><h2>Аккаунты</h2><button id="admin-refresh">Обновить список</button></div><label>Найти по логину или имени<input id="admin-search" type="search" autocomplete="off"></label><div id="admin-accounts" class="account-grid"></div><details><summary>Кампании сервера</summary><div id="admin-campaigns"></div></details><details open><summary>Журнал действий администратора · последние 200</summary><div id="admin-audit"></div></details></div></main><dialog id="admin-detail"><div class="toolbar"><h2 id="detail-title"></h2><button data-close>Закрыть</button></div><div id="detail-body"></div></dialog><dialog id="admin-operation"><h2 id="operation-title"></h2><p id="operation-note"></p><form id="operation-form"><label>Причина действия<textarea id="operation-reason" required minlength="5" maxlength="500"></textarea></label><label>Ваш пароль администратора<input id="operation-password" type="password" required autocomplete="current-password" maxlength="128"></label><p class="editor-error" role="alert"></p><div class="toolbar"><button id="operation-confirm">Выполнить</button><button type="button" data-close>Отмена</button></div></form></dialog><dialog id="admin-secret"><h2>Новый доступ пользователя</h2><p>Эти данные показаны один раз. Передайте их владельцу аккаунта. Старые входы и код восстановления отозваны.</p><pre id="secret-value"></pre><div class="toolbar"><button id="secr
